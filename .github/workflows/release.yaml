# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  # Its own job: the notes step pipes the Claude installer into bash, and
  # here the worst it can reach is a read-only token, its own OIDC token and
  # the notes text — not the token that publishes the release.
  notes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: v
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: notes
        uses: ./.github/actions/release-notes
        with:
          changelog: CHANGELOG.md
          version: ${{ steps.v.outputs.v }}
          subject: the Player extension for Streamline

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ steps.notes.outputs.file }}
          if-no-files-found: error

  release:
    needs: notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check the tag names the module's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          grep -Eq "^const version = \"${version}\"$" main.go || {
            echo "main.go does not declare version ${version}" >&2
            exit 1
          }

      - name: Build
        run: >-
          GOOS=wasip1 GOARCH=wasm go build -trimpath -buildmode=c-shared
          -o player.wasm .

      - name: Checksum
        run: sha256sum player.wasm > player.wasm.sha256

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes

      # The install lines carry the checksum, which only this job knows.
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sum="$(cut -d' ' -f1 player.wasm.sha256)"
          {
            cat "$RUNNER_TEMP/notes/release-notes.md"
            echo
            echo "---"
            echo "Add it under \`extensions\` in the Streamline config:"
            echo
            echo "    - name: player"
            echo "      source: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/player.wasm"
            echo "      sha256: ${sum}"
          } > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" player.wasm player.wasm.sha256
          --title "$TAG" --notes-file notes.md --verify-tag

      - name: Check the published file against its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir published
          gh release download "$TAG" --dir published
          (cd published && sha256sum --check player.wasm.sha256)
          cmp player.wasm published/player.wasm
