version: "3"

vars:
  WASM: player.wasm
  E2E_TIMEOUT: 5m

tasks:
  default:
    cmds:
      - task: build

  build:
    desc: Build player.wasm
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
      - exclude: e2e/**
    generates:
      - "{{.WASM}}"
    env:
      GOOS: wasip1
      GOARCH: wasm
    cmds:
      - go build -trimpath -buildmode=c-shared -o {{.WASM}} .

  lint:
    desc: Lint the guest (as wasip1) and the e2e module
    cmds:
      # go tool would build the linter itself for wasip1; resolve the host
      # binary first and aim only its package loading at the guest's target.
      - |
        linter=$(go tool -n golangci-lint)
        GOWORK=off GOOS=wasip1 GOARCH=wasm "$linter" run ./...
      - cd e2e && go tool golangci-lint run ./...

  fmt:
    desc: Format Go and Nix (treefmt, configured in flake.nix)
    cmd: treefmt

  fmt:check:
    desc: Check formatting without writing
    cmd: treefmt --ci

  test:unit:
    desc: Run the host-free specs natively
    cmds:
      - >-
        go tool ginkgo run -r --keep-going --label-filter=unit
        --skip-package=e2e {{.CLI_ARGS}}

  test:e2e:
    desc: Run the end-to-end suite against STREAMLINE_BIN
    deps: [build]
    preconditions:
      - sh: test -n "$STREAMLINE_BIN"
        msg: STREAMLINE_BIN must name a built streamline binary
    env:
      PLAYER_WASM: "{{.ROOT_DIR}}/{{.WASM}}"
    dir: e2e
    cmds:
      - go tool ginkgo run --keep-going --timeout={{.E2E_TIMEOUT}} {{.CLI_ARGS}}

  test:
    desc: Run every spec
    cmds:
      - task: test:unit
      - task: test:e2e

  # The same procedure as Streamline's release:app: one revision cut from a
  # fresh main@origin (never from @, which would seal the working copy into the
  # release), the version and the changelog edited inside it, main moved onto
  # it. jj snapshots the edits on the bookmark move.
  release:changelog:
    desc: Set VERSION in main.go, regenerate CHANGELOG.md, commit both and advance main. Usage - task release:changelog VERSION=0.7.0
    requires:
      vars: [VERSION]
    vars:
      V: '{{trimPrefix "v" .VERSION}}'
    preconditions:
      - &semver
        sh: 'echo "{{.V}}" | grep -qE "^[0-9]+\.[0-9]+\.[0-9]+"'
        msg: "VERSION must look like 0.7.0 or 0.7.0-alpha.1 (a leading v is accepted and stripped)"
    cmds:
      - jj git fetch --remote origin
      - 'jj new main@origin -m "docs(changelog): v{{.V}}"'
      - sed -i 's/^const version = ".*"$/const version = "{{.V}}"/' main.go
      - git-cliff --tag v{{.V}} -o CHANGELOG.md
      - jj bookmark set main -r @

  release:tag:
    desc: Tag main v<VERSION> and push both, triggering .github/workflows/release.yaml. Usage - task release:tag VERSION=0.7.0
    requires:
      vars: [VERSION]
    vars:
      V: '{{trimPrefix "v" .VERSION}}'
    preconditions:
      - *semver
      # jj tag list prints nothing on stdout for a name it doesn't have.
      - sh: '[ -z "$(jj tag list v{{.V}} 2>/dev/null)" ]'
        msg: "v{{.V}} already exists"
      # Read main, not the working copy: CI builds from the tag.
      - sh: 'jj file show -r main CHANGELOG.md 2>/dev/null | grep -q "^## \[{{.V}}\]"'
        msg: "main has no CHANGELOG.md section for {{.V}} — run: task release:changelog VERSION={{.V}}"
      - sh: 'jj file show -r main main.go | grep -q "^const version = \"{{.V}}\"$"'
        msg: "main's main.go is not at {{.V}} — run: task release:changelog VERSION={{.V}}"
    cmds:
      - jj tag set v{{.V}} -r main
      # main goes in the same push: a tag pushed alone leaves main local, and
      # the next renovate merge makes it conflicted on fetch.
      - jj git push --remote origin -b main --tag v{{.V}}

  release:
    desc: Cut a release end to end — changelog, commit, advance main, tag and push. Run the halves apart to read the changelog first. Usage - task release VERSION=0.7.0
    requires:
      vars: [VERSION]
    cmds:
      - task: release:changelog
        vars: {VERSION: "{{.VERSION}}"}
      - task: release:tag
        vars: {VERSION: "{{.VERSION}}"}
